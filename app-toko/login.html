<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PWA App Toko</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#14b8a6">
</head>

<body
    class="min-h-screen bg-gradient-to-br from-cyan-500 via-teal-500 to-cyan-700 flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-3xl shadow-2xl overflow-hidden">
            <div class="bg-gradient-to-r from-cyan-500 to-teal-500 text-white text-center py-8 px-6">
                <h1 class="text-3xl font-bold">🏪 PWA App Toko</h1>
                <p class="mt-2 text-cyan-100">Login untuk mengakses sistem manajemen barang</p>
            </div>

            <div class="p-8">
                <form id="loginForm" class="space-y-5">
                    <div>
                        <label class="block mb-2 text-gray-700 font-medium">Username</label>
                        <input type="text" id="username" placeholder="Masukkan username"
                            class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-cyan-500 focus:outline-none"
                            required>
                    </div>
                    <div>
                        <label class="block mb-2 text-gray-700 font-medium">Password</label>
                        <input type="password" id="password" placeholder="Masukkan password"
                            class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-cyan-500 focus:outline-none"
                            required>
                    </div>
                    <button type="submit" id="loginBtn"
                        class="w-full bg-gradient-to-r from-cyan-500 to-teal-500 text-white font-semibold py-3 rounded-xl hover:opacity-90 transition">
                        Login
                    </button>
                </form>

                <div class="mt-6 bg-cyan-50 border border-cyan-200 rounded-xl p-4">
                    <h3 class="font-semibold text-cyan-700 mb-2">🔑 Akun Login</h3>
                    <p class="text-sm text-gray-700">Username : <span class="font-bold text-cyan-700">admin</span></p>
                    <p class="text-sm text-gray-700">Password : <span class="font-bold text-cyan-700">12345</span></p>
                </div>

                <div class="mt-4 text-center text-xs text-gray-500">
                    PWA App Toko dengan Token-Based Authentication
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://pwa-naufal.infinityfreeapp.com/api-toko';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');

            loginBtn.innerText = 'Loading...';
            loginBtn.disabled = true;

            const formData = new FormData();
            formData.append('username', username);
            formData.append('password', password);

            try {
                const response = await fetch(`${API_URL}/login.php`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('token', data.token);
                    window.location.href = 'index.html';
                } else {
                    alert(data.message || 'Login gagal!');
                    loginBtn.innerText = 'Login';
                    loginBtn.disabled = false;
                }
            } catch (error) {
                alert('Koneksi gagal: ' + error.message);
                loginBtn.innerText = 'Login';
                loginBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
