<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Toko</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-blue-50 via-purple-50 to-teal-50 p-6">

    <div class="max-w-5xl mx-auto">

        <!-- HEADER -->
        <h1 class="text-3xl font-bold text-gray-700 mb-6">
            📦 Aplikasi Toko
        </h1>

        <!-- FORM -->
        <div class="bg-gradient-to-r from-blue-100 to-teal-100 p-6 rounded-2xl shadow-md mb-6 border border-white">
            <h2 class="text-lg font-semibold text-gray-700 mb-4">
                Tambah Barang
            </h2>

            <form id="form-barang" class="grid grid-cols-1 md:grid-cols-4 gap-3">

                <input type="text" name="nama" placeholder="Nama barang"
                    class="bg-white/80 border border-gray-200 p-2 rounded-lg focus:ring-2 focus:ring-blue-300 outline-none">

                <input type="number" name="harga" placeholder="Harga"
                    class="bg-white/80 border border-gray-200 p-2 rounded-lg focus:ring-2 focus:ring-blue-300 outline-none">

                <input type="number" name="stok" placeholder="Stok"
                    class="bg-white/80 border border-gray-200 p-2 rounded-lg focus:ring-2 focus:ring-blue-300 outline-none">

                <button type="submit"
                    class="bg-gradient-to-r from-blue-400 to-teal-400 text-white rounded-lg hover:scale-105 transition">
                    Simpan
                </button>

            </form>
        </div>

        <!-- TABEL -->
        <div class="bg-gradient-to-r from-purple-100 to-blue-100 p-6 rounded-2xl shadow-md border border-white">

            <h2 class="text-lg font-semibold text-gray-700 mb-4">
                Daftar Barang
            </h2>

            <div id="loading" class="text-gray-400 hidden mb-2">
                Memuat data...
            </div>

            <div id="error" class="text-red-400 hidden mb-2">
                Gagal memuat data
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-sm text-gray-700 border-separate border-spacing-y-2">
                    <thead>
                        <tr class="text-gray-500 text-xs uppercase">
                            <th class="px-4 py-2">No</th>
                            <th class="px-4 py-2">Nama</th>
                            <th class="px-4 py-2">Harga</th>
                            <th class="px-4 py-2">Stok</th>
                            <th class="px-4 py-2">Aksi</th>
                        </tr>
                    </thead>

                    <tbody id="daftar-barang"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
