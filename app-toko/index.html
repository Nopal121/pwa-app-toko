<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>PWA App Toko - Manajemen Barang</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Manifest & PWA -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="icon" href="icons/icon-192.png">

    <!-- Theme & Status Bar -->
    <meta name="theme-color" content="#14b8a6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="App Toko">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body class="bg-gradient-to-br from-teal-100 via-cyan-50 to-blue-100 min-h-screen p-4 md:p-6">
    <div class="max-w-6xl mx-auto">

        <!-- ==================== HEADER ==================== -->
        <div class="bg-white/80 backdrop-blur-lg rounded-3xl shadow-xl p-6 mb-8 border border-white/40">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <div>
                    <h1 class="text-3xl md:text-4xl font-bold text-teal-700">
                        📦 PWA App Toko
                    </h1>
                    <p class="text-gray-600 mt-2">
                        <i class="fas fa-search text-teal-500 mr-1"></i> Live Search
                        <i class="fas fa-arrows-alt-h mx-2 text-gray-400"></i>
                        <i class="fas fa-pagelines text-teal-500 mr-1"></i> Pagination
                    </p>
                </div>
                <button onclick="logout()"
                    class="bg-red-500 hover:bg-red-600 text-white px-5 py-3 rounded-xl shadow-lg transition transform hover:scale-105">
                    <i class="fas fa-sign-out-alt mr-2"></i> Logout
                </button>
            </div>
        </div>

        <!-- ==================== FORM TAMBAH/EDIT ==================== -->
        <div class="bg-white/80 backdrop-blur-lg shadow-xl rounded-3xl p-6 mb-8 border border-white/40">
            <h2 class="text-2xl font-semibold text-gray-700 mb-5">
                <i class="fas fa-plus-circle text-teal-500 mr-2"></i> Tambah / Edit Barang
            </h2>
            <form id="form-barang" enctype="multipart/form-data" class="grid md:grid-cols-5 gap-4">
                <input type="hidden" id="barang-id">

                <input type="text" id="nama" name="nama" placeholder="Nama Barang" required
                    class="px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-teal-400">

                <input type="number" id="harga" name="harga" placeholder="Harga" required
                    class="px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-teal-400">

                <input type="number" id="stok" name="stok" placeholder="Stok" required
                    class="px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-teal-400">

                <input type="file" id="gambar" name="gambar" accept="image/*"
                    class="px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-teal-400">

                <button type="submit" id="btn-submit"
                    class="bg-gradient-to-r from-teal-500 to-cyan-500 hover:scale-105 transition text-white font-semibold px-5 py-3 rounded-xl shadow-lg">
                    <i class="fas fa-save mr-2"></i> Simpan
                </button>
            </form>
        </div>

        <!-- ==================== SEARCH & PAGINATION ==================== -->
        <div class="bg-white/80 backdrop-blur-lg shadow-xl rounded-3xl p-6 mb-8 border border-white/40">
            <div class="flex flex-col md:flex-row gap-4 items-center">
                <!-- Input Pencarian -->
                <div class="flex-1 w-full">
                    <div class="relative">
                        <i class="fas fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        <input type="text" id="inputCari" placeholder="🔍 Cari barang... (ketik untuk mencari)"
                            class="w-full pl-12 pr-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-teal-400">
                    </div>
                </div>

                <!-- Tombol Navigasi -->
                <div class="flex gap-2 items-center flex-shrink-0">
                    <button id="btnPrev"
                        class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-xl transition disabled:opacity-50 disabled:cursor-not-allowed">
                        <i class="fas fa-chevron-left mr-1"></i> Prev
                    </button>

                    <span id="infoHalaman" class="text-sm text-gray-600 font-medium px-3 min-w-[120px] text-center">
                        Halaman 1 / 1
                    </span>

                    <button id="btnNext"
                        class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-xl transition disabled:opacity-50 disabled:cursor-not-allowed">
                        Next <i class="fas fa-chevron-right ml-1"></i>
                    </button>
                </div>
            </div>

            <!-- Info tambahan -->
            <div class="mt-3 text-xs text-gray-400 flex justify-between">
                <span id="infoTotalData">Total data: 0</span>
                <span id="infoShowing">Menampilkan 0-0 dari 0</span>
            </div>
        </div>

        <!-- ==================== DATA BARANG ==================== -->
        <div class="bg-white/80 backdrop-blur-lg shadow-xl rounded-3xl p-6 border border-white/40">
            <div class="flex flex-col md:flex-row justify-between items-center gap-3 mb-5">
                <h2 class="text-2xl font-semibold text-gray-700">
                    <i class="fas fa-boxes text-teal-500 mr-2"></i> Data Barang
                </h2>
                <button onclick="fetchData(currentKeyword || '', currentPage || 1)"
                    class="bg-teal-500 hover:bg-teal-600 text-white px-4 py-2 rounded-xl transition transform hover:scale-105">
                    <i class="fas fa-sync-alt mr-2"></i> Refresh
                </button>
            </div>

            <!-- LOADING -->
            <div id="loading" class="hidden text-center py-5">
                <div class="inline-flex items-center gap-2 text-teal-600 font-medium">
                    <svg class="animate-spin h-5 w-5 text-teal-600" xmlns="http://www.w3.org/2000/svg" fill="none"
                        viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                        </circle>
                        <path class="opacity-75" fill="currentColor"
                            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                        </path>
                    </svg>
                    Memuat data...
                </div>
            </div>

            <!-- ERROR -->
            <div id="error" class="hidden bg-red-100 text-red-600 p-4 rounded-xl mb-4">
                <i class="fas fa-exclamation-triangle mr-2"></i> Gagal memuat data
            </div>

            <!-- TABLE -->
            <div class="overflow-x-auto">
                <table class="w-full border-separate border-spacing-y-3">
                    <thead>
                        <tr class="text-left text-gray-600">
                            <th class="px-4 py-2">No</th>
                            <th class="px-4 py-2">Nama</th>
                            <th class="px-4 py-2">Gambar</th>
                            <th class="px-4 py-2">Harga</th>
                            <th class="px-4 py-2">Stok</th>
                            <th class="px-4 py-2">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="daftar-barang">
                        <tr>
                            <td colspan="6" class="text-center text-gray-400 py-6">
                                <i class="fas fa-database mr-2"></i> Loading data...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- ==================== FOOTER ==================== -->
        <div class="text-center mt-8 text-gray-500 text-sm">
            <i class="fas fa-mobile-alt mr-1"></i> Progressive Web App (PWA)
            <i class="fas fa-shield-alt mx-1"></i> Token Authentication
            <i class="fas fa-search mx-1"></i> Live Search & Pagination
        </div>

    </div>

    <script src="app.js?v=11"></script>
</body>

</html>
