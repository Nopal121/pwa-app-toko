<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Toko</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-6">

    <div class="max-w-5xl mx-auto">

        <h1 class="text-2xl font-bold mb-4">📦 Data Barang</h1>

        <!-- FORM TAMBAH BARANG -->
        <form id="form-barang" class="bg-white p-4 rounded shadow mb-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <input type="text" id="nama" placeholder="Nama Barang" required class="border p-2 rounded">

                <input type="number" id="harga" placeholder="Harga" required class="border p-2 rounded">

                <input type="number" id="stok" placeholder="Stok" required class="border p-2 rounded">
            </div>

            <button type="submit" class="mt-4 bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                Simpan Barang
            </button>
        </form>

        <!-- LOADING -->
        <div id="loading" class="hidden mb-4 text-blue-500">Loading...</div>

        <!-- ERROR -->
        <div id="error" class="hidden mb-4 text-red-500"></div>

        <!-- TABEL -->
        <div class="bg-white shadow rounded overflow-hidden">
            <table class="min-w-full">
                <thead class="bg-gray-800 text-white">
                    <tr>
                        <th class="px-6 py-3">ID</th>
                        <th class="px-6 py-3">Nama</th>
                        <th class="px-6 py-3">Harga</th>
                        <th class="px-6 py-3">Stok</th>
                        <th class="px-6 py-3">Aksi</th>
                    </tr>
                </thead>
                <tbody id="daftar-barang" class="divide-y"></tbody>
            </table>
        </div>

    </div>

    <script src="app.js"></script>
</body>

</html>
